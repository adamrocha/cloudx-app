apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - bidder-deployment.yaml
  - bidder-service.yaml
  - bidder-network-policy.yaml
  - ssp-deployment.yaml
  - ssp-service.yaml
  - ssp-network-policy.yaml

# Example: Override image tag without editing deployment files
# images:
#   - name: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/cloudx-app-repo
#     newTag: v1.0.0

# Example: Override replicas for specific deployments
# replicas:
#   - name: ssp
#     count: 3
#   - name: bidder
#     count: 3

# Labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize